name: Schema Test

on: [push]

jobs:
  schema-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Install Postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create schema
        run: |
          psql -h localhost -U postgres -f sql/schema.sql
        env:
          PGPASSWORD: postgres

      - name: Verify table
        run: |
          psql -h localhost -U postgres -c "\dt"
        env:
          PGPASSWORD: postgres
