name: GitHub Stars Crawler

on: [push]

jobs:
  crawl:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup schema
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -f sql/schema.sql
        env:
          PGPASSWORD: postgres

      - name: Crawl GitHub stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python crawler/crawler.py

      - name: Export CSV
        run: |
          psql -h localhost -U postgres -c "\copy repositories TO 'repos.csv' CSV HEADER"
        env:
          PGPASSWORD: postgres

      - uses: actions/upload-artifact@v3
        with:
          name: stars-data
          path: repos.csv
